server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 36.103.234.95;

    access_log /var/log/nginx/surrogate-newton-access.log;
    error_log /var/log/nginx/surrogate-newton-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /data/surrogate-newton/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "HTTPS certificate provisioning is in progress.\n";
        add_header Content-Type text/plain always;
    }
}

limit_req_zone $binary_remote_addr zone=demo_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=demo_connections:10m;

upstream surrogate_newton_demo {
    server 127.0.0.1:18082;
    keepalive 16;
}

server {
    listen 8888 default_server;
    listen [::]:8888 default_server;
    server_name 36.103.234.95;

    access_log /var/log/nginx/surrogate-newton-access.log;
    error_log /var/log/nginx/surrogate-newton-error.log warn;

    client_max_body_size 2m;
    limit_conn demo_connections 12;
    limit_req zone=demo_per_ip burst=20 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Keep the paper project page on GitHub Pages. The public IP only hosts
    # the interactive demo and its same-origin API/static dependencies.
    location = / {
        add_header Cache-Control "no-store" always;
        return 302 https://leimingcheng.github.io/surrogate-newton-cfd/;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        return 302 https://leimingcheng.github.io/surrogate-newton-cfd/;
    }

    location / {
        proxy_pass http://surrogate_newton_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Field-result payloads can exceed Nginx's proxy buffers. Stream them
        # directly instead of spilling transient response bodies to disk.
        proxy_buffering off;
    }
}

limit_req_zone $binary_remote_addr zone=demo_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=demo_connections:10m;

upstream surrogate_newton_demo {
    server 127.0.0.1:18082;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 36.103.234.95;

    location ^~ /.well-known/acme-challenge/ {
        root /data/surrogate-newton/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 36.103.234.95;

    ssl_certificate /etc/letsencrypt/live/36.103.234.95/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/36.103.234.95/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/surrogate-newton-access.log;
    error_log /var/log/nginx/surrogate-newton-error.log warn;

    auth_basic "Surrogate-Newton CFD research preview";
    auth_basic_user_file /data/surrogate-newton/secrets/demo.htpasswd;

    client_max_body_size 2m;
    limit_conn demo_connections 12;
    limit_req zone=demo_per_ip burst=20 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location = / {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        return 302 https://leimingcheng.github.io/surrogate-newton-cfd/;
    }

    location = /index.html {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        return 302 https://leimingcheng.github.io/surrogate-newton-cfd/;
    }

    location / {
        proxy_pass http://surrogate_newton_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

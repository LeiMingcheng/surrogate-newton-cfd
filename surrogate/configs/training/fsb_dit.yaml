experiment:
  name: fsb_dit_airfoil
  seed: 42
model:
  family: fsb
  backbone: dit
  params:
    field_channels: 5
    coord_channels: 4
    wall_layers: 84
    spatial_shape:
    - 88
    - 304
    geometry_dim: 27
    flow_condition_dim: 3
    hidden_dim: 640
    num_layers: 12
    num_heads: 8
    patch_size: 8
    condition_fusion_method: attention
    use_gradient_checkpointing: true
    geometry_condition:
      source: wall_coords
      pool: mean
      wall_row_index: 0
      normalize_wall_coords: true
      hidden_dim: 64
    stability_config:
      adaln_clamp: true
      clamp_head:
        enabled: true
        clean_output: true
        clamp_mode: tanh
        learnable_scale: true
        per_channel: true
        init_scale: 12.0
        min_scale: 0.001
data:
  index_path: datasets/index.csv
  stats_path: artifacts/turbulent-scale-stats.json
  normalize: true
  scale_turbulent: true
  batch_size: 32
  num_workers: 4
  train_split: 0.9
  val_split: 0.1
  test_split: 0.0
task:
  kind: train
training:
  epochs: 1000
  warmup_ratio: 0.02
  eta_min_ratio: 0.01
  optimizer:
    name: adamw
    lr: 1.0e-05
    weight_decay: 0.0003
  loss:
    wall_layers: 84
    use_volume_weighted_mse: true
    volume_weight_alpha: 0.5
    volume_weight_max: 10000.0
    fsb_reconstruction_weight: 0.01
    wall_mse_weight: 0.0
    wall_mse_layers: 5
    wall_cp_weight: 0.1
    wall_cp_reduction: smooth_l1
    gradient_loss_weight: 0.0
    flow_perceptual_weight: 0.005
    flow_perceptual_level_weights:
    - 1.0
    - 0.5
    - 0.25
    - 0.25
    flow_perceptual_n_levels: 3
    flow_perceptual_warmup_epochs: 0
    flow_perceptual_warmup_center: 0
    flow_perceptual_warmup_sharpness: 1
    flow_perceptual_encoder_checkpoint: artifacts/flow-perceptual-encoder.pt
    flow_perceptual_encoder_config:
      channels:
      - 64
      - 128
      - 256
      - 512
      input_channels: 15
    flow_perceptual_manifold_prior:
      enabled: false
      lambda_prior: 0.1
      lambda_stay: 0.05
    res_loss_enabled: true
    res_loss_weight: 5.0e-09
    res_loss_reduction: l1
    res_field_scale_mode: none
    res_field_eps: 1.0e-12
    res_field_norm: l2_sq
    res_field_huber_delta: 1.0
    res_loss_warmup_epochs: 0
    res_loss_warmup_center: 0
    res_loss_warmup_sharpness: 1
    res_loss_weights:
      continuity: 10.0
      momentum_x: 1.0
      momentum_y: 1.0
      energy: 0.1
      turbulence: 1.0
    residual_smoothing_enabled: true
    residual_smoothing_lambda_eta: 4.0
    residual_smoothing_lambda_xi: 1.0
  use_ema: true
  ema_decay: 0.999
  checkpoint_path: null
  load_training_state: false
fsb:
  bridge:
    type: i2sb
    num_timesteps: 1000
    beta_max: 0.3
    beta_schedule: symmetric_sine
    timestep_spacing: quadratic
    prediction_type: x0
  inference:
    custom_timesteps:
    - 999
    - 749
    - 499
    - 249
    - 0
    eta: 0.0
runtime:
  checkpoint: artifacts/fsb-dit-airfoil-2608.04400.pt
  device: cuda
evaluation:
  output_dir: outputs/evaluation
  rich:
    compute_physical_field_metrics: true
    compute_forces: true
    compute_residuals: false
    record_samples: true
    field_metrics:
      use_volume_weighted_mse: false
      channel_names:
      - density
      - velocity_x
      - velocity_y
      - pressure
      - sa_nu_tilde
    physical_field_metrics:
      use_volume_weighted_mse: false
      channel_names:
      - density
      - velocity_x
      - velocity_y
      - pressure
      - sa_nu_tilde
    residual_metrics:
      targets:
      - pred
      - target
